<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#1C1C1B"/>
  <!-- 1. Left Book (medium height, upright) -->
  <rect x="5.5" y="12" width="3.8" height="13" rx="0.75" fill="#FAF9F5"/>
  <!-- 2. Middle Book (tallest, upright) -->
  <rect x="11" y="6" width="3.8" height="19" rx="0.75" fill="#FAF9F5"/>
  <!-- 3. Right Book (leaning to the right) -->
  <rect x="16.5" y="7" width="3.8" height="18" rx="0.75" fill="#FAF9F5" transform="rotate(22 17.5 24.5)"/>
  <!-- 4. Bottom Horizontal Shelf Line (champagne gold accent) -->
  <line x1="3.5" y1="26" x2="28.5" y2="26" stroke="#E5C28F" stroke-width="1.8" stroke-linecap="round"/>
</svg>
